name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows version-one gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify frontend and contracts
        shell: pwsh
        run: pnpm verify

      - name: Audit production frontend dependencies
        shell: pwsh
        run: pnpm audit --audit-level high --prod

      - name: Install pinned RustSec audit tool
        shell: pwsh
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked Rust dependencies
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Enforce dependency license policy
        shell: pwsh
        run: >-
          node scripts/release/generate-license-report.mjs
          --root .
          --output "$env:RUNNER_TEMP\THIRD-PARTY-LICENSES.json"
          --notices "$env:RUNNER_TEMP\THIRD-PARTY-NOTICES.txt"

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features

      - name: Build native debug application
        shell: pwsh
        run: pnpm tauri build --debug --no-bundle

  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
