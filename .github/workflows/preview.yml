name: Unsigned Windows technical preview

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.x tag to publish as an unsigned technical preview
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: preview-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preview:
    name: Publish unsigned Windows technical preview
    runs-on: windows-2025
    timeout-minutes: 90
    environment: preview

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Resolve and verify the preview tag
        id: preview
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if ($env:REQUESTED_TAG -notmatch '^v0\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Technical previews require a v0.x SemVer tag."
          }
          $tagCommit = git rev-list -n 1 $env:REQUESTED_TAG
          $headCommit = git rev-parse HEAD
          if ($tagCommit -ne $headCommit) {
            throw "Checked-out commit does not match the requested preview tag."
          }
          $version = $env:REQUESTED_TAG.Substring(1)
          "tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt,clippy

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized preview version
        shell: pwsh
        run: >-
          node scripts/release/verify-release-version.mjs
          --root .
          --tag "${{ steps.preview.outputs.tag }}"

      - name: Run all repository gates
        shell: pwsh
        run: |
          pnpm verify
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          pnpm audit --audit-level high --prod

      - name: Install pinned RustSec audit tool
        shell: pwsh
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked Rust dependencies
        shell: pwsh
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Require free updater-signing configuration
        shell: pwsh
        env:
          FORMATION_LAP_UPDATE_PUBLIC_KEY: ${{ vars.FORMATION_LAP_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          foreach ($value in @(
            $env:FORMATION_LAP_UPDATE_PUBLIC_KEY,
            $env:TAURI_SIGNING_PRIVATE_KEY
          )) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "A required preview updater-signing input is not configured."
            }
          }

      - name: Build application and helper before bundling
        shell: pwsh
        env:
          FORMATION_LAP_RELEASE_CHANNEL: preview
          FORMATION_LAP_RELEASE_IDENTITY_PUBLIC_KEY: ${{ vars.FORMATION_LAP_UPDATE_PUBLIC_KEY }}
          FORMATION_LAP_UPDATE_PUBLIC_KEY: ${{ vars.FORMATION_LAP_UPDATE_PUBLIC_KEY }}
        run: pnpm tauri build --no-bundle

      - name: Bind and sign the preview helper release identity
        shell: pwsh
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $payload = "src-tauri\release-identity\formation-lap-release-identity.payload"
          $manifest = "src-tauri\release-identity\formation-lap-release-identity.json"
          $main = "src-tauri\target\release\formation-lap.exe"
          $helper = "src-tauri\target\release\formation-lap-elevated-helper.exe"
          node scripts/release/generate-release-identity.mjs --main $main --helper $helper --version $env:VERSION --channel preview --payload $payload
          pnpm tauri signer sign $payload
          node scripts/release/generate-release-identity.mjs --main $main --helper $helper --version $env:VERSION --channel preview --payload $payload --signature "$payload.sig" --output $manifest

      - name: Bundle unsigned technical-preview binaries
        id: bundle
        shell: pwsh
        env:
          FORMATION_LAP_RELEASE_CHANNEL: preview
          FORMATION_LAP_RELEASE_IDENTITY_PUBLIC_KEY: ${{ vars.FORMATION_LAP_UPDATE_PUBLIC_KEY }}
          FORMATION_LAP_UPDATE_PUBLIC_KEY: ${{ vars.FORMATION_LAP_UPDATE_PUBLIC_KEY }}
        run: |
          pnpm tauri bundle --bundles nsis --config src-tauri/tauri.release-bundle.conf.json --no-sign --ci
          $installers = @(Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer."
          }
          "installer=$($installers[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Prepare named installer and unsigned-preview disclosure
        id: prepared
        shell: pwsh
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          INSTALLER: ${{ steps.bundle.outputs.installer }}
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          $namedInstaller = Join-Path $PWD "release\Formation-Lap_$env:VERSION`_x64-setup.exe"
          Copy-Item -LiteralPath $env:INSTALLER -Destination $namedInstaller
          @(
            "Formation Lap unsigned technical preview"
            ""
            "This v0.x installer, application, and one-shot elevated helper do not have Windows Authenticode publisher signatures."
            "Windows may show SmartScreen and Unknown publisher warnings. Organization policy may prevent installation or elevation."
            "This preview is not a Stable Formation Lap release. Install it only if you trust the official Williem3/FormationLap source and release provenance."
            "Verify the installer against SHA256SUMS.txt. In-app updates still require the separate Tauri updater signature."
          ) | Set-Content -LiteralPath "release\UNSIGNED-PREVIEW.txt" -Encoding utf8
          "installer=$namedInstaller" >> $env:GITHUB_OUTPUT

      - name: Tauri-sign the unsigned preview installer bytes
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri signer sign "${{ steps.prepared.outputs.installer }}"

      - name: Generate dependency-license report and notices
        shell: pwsh
        run: >-
          node scripts/release/generate-license-report.mjs
          --root .
          --output "release\THIRD-PARTY-LICENSES.json"
          --notices "release\THIRD-PARTY-NOTICES.txt"

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.38.0

      - name: Generate SPDX SBOM
        shell: pwsh
        env:
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          & "${{ steps.syft.outputs.cmd }}" scan dir:. --source-name formation-lap --source-version $env:VERSION -o "spdx-json=release\Formation-Lap_$env:VERSION.spdx.json"
          node scripts/release/normalize-spdx-sbom.mjs --file "release\Formation-Lap_$env:VERSION.spdx.json" --version $env:VERSION

      - name: Generate preview updater metadata and SHA-256 manifest
        shell: pwsh
        env:
          VERSION: ${{ steps.preview.outputs.version }}
          TAG: ${{ steps.preview.outputs.tag }}
        run: |
          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          node scripts/release/generate-preview-metadata.mjs --directory release --version $env:VERSION --tag $env:TAG --notes "docs\releases\$env:VERSION.md" --published-at $publishedAt

      - name: Verify final preview artifact contract
        shell: pwsh
        run: >-
          node scripts/release/verify-preview-artifacts.mjs
          --directory release
          --version "${{ steps.preview.outputs.version }}"
          --tag "${{ steps.preview.outputs.tag }}"

      - name: Attest preview provenance
        id: provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: release/*

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.preview.outputs.tag }}
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create $env:TAG @assets --verify-tag --title "Formation Lap $env:VERSION [UNSIGNED TECHNICAL PREVIEW]" --notes-file "docs\releases\$env:VERSION.md" --prerelease
          "Provenance: ${{ steps.provenance.outputs.attestation-url }}"
