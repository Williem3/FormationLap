[package]
name = "formation-lap"
version = "0.1.0"
description = "Formation Lap prepares, monitors, and closes sim-racing sessions."
authors = ["Formation Lap contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
default-run = "formation-lap"

[lib]
name = "formation_lap_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
