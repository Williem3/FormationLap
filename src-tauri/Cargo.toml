[package]
name = "formation-lap"
version = "0.9.0-preview.5"
description = "Formation Lap prepares, monitors, and closes sim-racing sessions."
authors = ["Formation Lap contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"
default-run = "formation-lap"
autobins = false

[features]
development-tools = []
elevated-helper = []
process-fixtures = []

[lib]
name = "formation_lap_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "formation-lap"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "formation-lap-process-fixture"
path = "tests/fixtures/process_fixture.rs"
required-features = ["process-fixtures"]
test = false
bench = false

[[bin]]
name = "formation-lap-launcher-fixture"
path = "tests/fixtures/launcher_fixture.rs"
required-features = ["process-fixtures"]
test = false
bench = false

[[bin]]
name = "formation-lap-stop-fixture"
path = "tests/fixtures/stop_fixture.rs"
required-features = ["process-fixtures"]
test = false
bench = false

[[bin]]
name = "generate-bindings"
path = "src/bin/generate-bindings.rs"
required-features = ["development-tools"]
test = false
bench = false

[[bin]]
name = "validate-catalog"
path = "src/bin/validate-catalog.rs"
required-features = ["development-tools"]
test = false
bench = false

[[bin]]
name = "formation-lap-elevated-helper"
path = "src/bin/elevated-helper.rs"
required-features = ["elevated-helper"]
test = false
bench = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
semver = "=1.0.28"
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
